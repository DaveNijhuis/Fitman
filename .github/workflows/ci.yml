name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  backend:
    name: Backend quality
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Cache uv package store
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: uv-
      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Type check (mypy)
        run: .venv/bin/mypy .
      - name: Tests (pytest)
        run: .venv/bin/pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80
        env:
          SECRET_KEY: ci-test-secret-key-for-ci-only-not-for-production
          ADMIN_USERNAME: testuser
          ADMIN_PASSWORD: testpass
          DATA_DIR: /tmp/fitman_test

  docker:
    name: Docker production build
    runs-on: self-hosted
    env:
      DOCKER_HOST: ${{ vars.DOCKER_SOCKET }}
    steps:
      - uses: actions/checkout@v5
      - name: Create stub .env for build
        run: |
          echo "SECRET_KEY=ci_placeholder_key" >> .env
          echo "ADMIN_USERNAME=ci" >> .env
          echo "ADMIN_PASSWORD=ci" >> .env
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
