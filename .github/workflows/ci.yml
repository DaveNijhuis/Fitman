name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: node-modules-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build
        run: npm run build

  backend:
    name: Backend quality
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Cache uv package store
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: uv-
      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: mypy-
      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Type check (mypy)
        run: .venv/bin/mypy .
      - name: Tests (pytest)
        run: .venv/bin/pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80
        env:
          SECRET_KEY: ci-test-secret-key-for-ci-only-not-for-production
          DATABASE_URL: postgresql://fitman:fitman@localhost:5432/fitman_test

  docker:
    name: Docker production build
    runs-on: self-hosted
    env:
      DOCKER_HOST: ${{ vars.DOCKER_SOCKET }}
    steps:
      - uses: actions/checkout@v5
      - name: Create stub .env for build
        run: |
          echo "SECRET_KEY=ci_placeholder_key" >> .env
          echo "DATABASE_URL=postgresql://fitman:fitman@postgres:5432/fitman" >> .env
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

  e2e:
    name: E2E tests
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    needs: [frontend, backend]
    env:
      DOCKER_HOST: ${{ vars.DOCKER_SOCKET }}
    steps:
      - uses: actions/checkout@v5
      - name: Tear down any leftover E2E stack
        run: docker compose -f docker-compose.e2e.yml down -v || true
      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build
      - name: Cache e2e node_modules
        id: cache-e2e-modules
        uses: actions/cache@v5
        with:
          path: e2e/node_modules
          key: e2e-node-modules-${{ hashFiles('e2e/package.json') }}
      - name: Install E2E dependencies
        if: steps.cache-e2e-modules.outputs.cache-hit != 'true'
        run: npm install
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Tear down E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
