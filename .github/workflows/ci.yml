name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  backend:
    name: Backend quality
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Type check (mypy)
        run: .venv/bin/mypy .
      - name: Tests (pytest)
        run: .venv/bin/pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key
          ADMIN_USERNAME: testuser
          ADMIN_PASSWORD: testpass
          DATA_DIR: /tmp/fitman_test

  docker:
    name: Docker production build
    runs-on: self-hosted
    env:
      DOCKER_HOST: ${{ vars.DOCKER_SOCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Create stub .env for build
        run: |
          echo "SECRET_KEY=ci_placeholder_key" >> .env
          echo "ADMIN_USERNAME=ci" >> .env
          echo "ADMIN_PASSWORD=ci" >> .env
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
