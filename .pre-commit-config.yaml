repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: backend/.venv/bin/ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: backend/.venv/bin/ruff format
        language: system
        types: [python]
        pass_filenames: false
