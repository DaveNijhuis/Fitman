[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["alembic/versions/*"]

[tool.ruff]
exclude = [".venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [".venv/", "alembic/"]
