# Fitman: the production stack. From the repo root, with .env set up (README,
# step 4), this starts everything: database, backend and the web app on port 80.
#
#   docker compose up -d
#
# Development is docker-compose.dev.yml; E2E tests use docker-compose.e2e.yml.
#
# No `name:` on purpose: the project, and so the data volume <project>_db_data,
# is named after the clone's directory, as it always has been. Pinning a name
# would move an existing instance onto a new, empty volume.

services:
  # Refuses to let the stack start on a data volume PostgreSQL cannot use.
  # A pre-PostgreSQL instance still has fitman.db here, and postgres responds
  # with "initdb: directory exists but is not empty" in a restart loop, which
  # says nothing about the migration that caused it. Uses the postgres image
  # so no additional image is pulled.
  db-guard:
    image: postgres:16
    volumes:
      - db_data:/data:ro
    command: >
      sh -c '
      if [ ! -f /data/PG_VERSION ] && [ -n "$$(ls -A /data 2>/dev/null)" ]; then
        echo "";
        echo "ERROR: the db_data volume is not a PostgreSQL cluster.";
        if [ -f /data/fitman.db ]; then
          echo "It still holds fitman.db from the SQLite version of Fitman.";
        fi;
        echo "PostgreSQL will not initialise over a non-empty directory.";
        echo "";
        echo "Recover the old file first, then remove the volume:";
        echo "  docker run --rm -v fitman_db_data:/d -v \"\$$(pwd)\":/out postgres:16 cp /d/fitman.db /out/";
        echo "  docker compose down";
        echo "  docker volume rm fitman_db_data";
        echo "";
        echo "See the migration section in README.md.";
        exit 1;
      fi'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fitman
      POSTGRES_USER: fitman
      # The operator's own secret (#335); the stack refuses to start without it.
      # Applied only when the volume is first initialised: to change it on an
      # existing database, see "Changing the database password" in README.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see README.md, step 4)}
    # Queryable from the server itself, or through an SSH tunnel, never from
    # the network: bound to 127.0.0.1. 5433 leaves 5432 free for a dev database;
    # FITMAN_DB_PORT moves it (#347). A port only: an address there would make
    # this spec invalid, so the database can't be opened up by accident.
    ports:
      - "127.0.0.1:${FITMAN_DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    depends_on:
      db-guard:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitman"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # Built from the same password as the database, so the two can't drift;
      # overrides any DATABASE_URL in .env. Use a hex password (README step 4):
      # anything else would need URL-encoding here.
      DATABASE_URL: postgresql://fitman:${POSTGRES_PASSWORD}@postgres:5432/fitman
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # FITMAN_HTTP_PORT moves the web app off 80 when something else holds it,
    # such as a reverse proxy (#347): a port (8081), or an address and port
    # (127.0.0.1:8081) to take connections from this machine only.
    ports:
      - "${FITMAN_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
