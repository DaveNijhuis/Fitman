# Repo-wide ruff settings.
#
# backend/pyproject.toml governs backend/ only. Anything outside it — once the
# smart scale scripts, now any future Python there — fell back to ruff's built-in defaults,
# which are not a stable contract: the 0.15 -> 0.16 bump widened them and broke
# the pre-commit hook on files nobody had touched. The hook runs
# `ruff check --fix` from the repo root with no arguments (pass_filenames:
# false), so it lints everything, and "everything" needs a deliberate ruleset
# rather than whatever the current release happens to enable.
#
# Kept in step with backend/pyproject.toml so both halves are held to one
# standard.

exclude = [".venv", "__pycache__", "backend/alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501"]

[lint.flake8-bugbear]
# Depends() in an argument default is the FastAPI dependency-injection idiom.
extend-immutable-calls = ["fastapi.Depends"]

[lint.per-file-ignores]
# S101: pytest is built on bare assert.
# S105/S106/S107: fixture credentials are not real secrets.
# S607: test helpers invoke `sh` and `docker` by name on purpose.
"backend/tests/**" = ["S101", "S105", "S106", "S107", "S607"]
